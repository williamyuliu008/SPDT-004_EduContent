# SPDT-004_EduContent 与 OMAS 衔接配置
spdt_id: SPDT-004
spdt_name: 教育内容产品线
category: education
domains: [education, pedagogy]

# ── SOP 路由结果 ──
sop_family: content_manufacturing
secondary_family: knowledge_creation

# ── 依赖的 OMAS Cell ──
omas_cells:
  - cell: Infra
    capabilities: [model_router]
  - cell: CMC
    capabilities: [content_pipeline]
  - cell: SDC
    capabilities: [template_design, course_structure]
  - cell: QAC
    capabilities: [quality_gate, accuracy_check]
  - cell: IRC
    capabilities: [knowledge_synthesis]

# ── 领域本体引用 ──
ontology:
  - domain: education_pedagogy
    profile: D:/1_omas/toolbox/Ontology/profiles/education/
  - domain: subject_specific
    profile: D:/1_omas/toolbox/Ontology/profiles/subject/

# ── 复用的 DAG 模板 ──
dag_templates: []

# ── 知识库 ──
knowledge_bases:
  - collection: education_knowledge
    path_env: SPDT_EDU_ROOT

# ── 反哺记录 ──
feedback: []
