# ============================================================
# 附录：AI 配图 Prompt 模板库
# ============================================================

prompt_templates:

  # 临帖标注图 Prompt
  lint_template: >
    中国书法临帖标注图。{script_type}·{calligrapher}·{masterpiece}。
    字：{unicode}。
    要求：田字格参考线（淡灰色），笔画顺序编号①②③④⑤⑥⑦⑧，
    主笔红色高亮，起收笔用圆圈标注，
    {teaching_points}。
    教科书插图风格，高清，白底，无水印。

  # 草书辨析卡 Prompt
  comparison_template: >
    中国书法对比插图。
    左侧：{calligrapher_a}·{style_tag_a}。
    风格特征：{style_description_a}。
    右侧：{calligrapher_b}·{style_tag_b}。
    风格特征：{style_description_b}。
    同一字"{character}"，竖排两列，
    标注书家名和作品名，教育教科书风格，16:9。

  # 五体概览图 Prompt
  overview_template: >
    中国书法五体概览图。
    从左至右：篆书（峄山碑风格）→ 隶书（礼器碑风格） →
    楷书（欧阳询风格）→ 行书（兰亭序风格）→ 草书（怀素自叙帖风格）。
    同一汉字"{unicode}"，五体并排对比，
    每体下方标注书体名称，
    教育教科书风格，色彩区分五体，白底，16:9。

  # 永字八法教学图 Prompt
  bagong_template: >
    中国书法永字八法教学图。
    田字格中显示"永"字完整形态，
    八法依次标注：一点为"点"，一横为"横"，一直为"竖"，
    一撇为"撇"，一挑为"提"，一折为"折"，一钩为"钩"，一捺为"捺"。
    每个笔画编号标注，行笔方向用箭头表示，
    主笔（竖钩）用红色高亮。
    底部附永字八法口诀。
    教育教科书风格，高清，白底，标注清晰。

# ============================================================
# 使用说明（Usage Note）
# ============================================================
# 本体库使用方式：
#
# 1. AI 生图时 → 从对应书体模块提取 visual_must / visual_forbidden
#    注入到 Prompt 约束层
#
# 2. 草书辨析时 → 从 grass_script_discrimination 提取 pair 的
#    visual_key_differences，确保两图风格差异被准确呈现
#
# 3. 临帖标注时 → 从 model_characters 提取 stroke_sequence
#    和 annotated_image 路径作为标准参照
#
# 4. 不同学段 → 从 cognitive_levels 选取对应层级的视觉要求
#
# 本体库 v0.1 状态：
