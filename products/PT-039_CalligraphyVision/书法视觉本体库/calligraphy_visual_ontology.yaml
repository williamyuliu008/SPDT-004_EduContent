# ============================================================
# 模块四：草书辨析特征（Grass Script Discrimination）
# ============================================================
# 核心用途：AI 生成草书对比图时，确保两书家的风格差异被准确呈现
# 防止"张旭风格和怀素风格混淆"
# ============================================================

grass_script_discrimination:

  # 辨析对 1：王羲之 vs 王献之 ───────────────────
  - pair_id: wang_xizhi_vs_wang_xianzhi
    pair_label: "王羲之 vs 王献之"

    calligrapher_a:
      id: wang_xizhi
      name: 王羲之
      period: "东晋（303-361年）"
      style_tag: "雅正·含蓄·中和之美"
      style_description: >
        书圣王羲之的草书代表了中国草书的最高境界。
        特点：含蓄内敛，笔意连贯而不过度；结体秀美，骨力与柔情并存；
        用笔精到，无一笔懈怠；整体气韵生动，风神潇洒。
        后世称"右军书法'如清风出袖，明月入怀'"。

    calligrapher_b:
      id: wang_xianzhi
      name: 王献之
      period: "东晋（344-386年）"
      style_tag: "外拓·奔放·创新精神"
      style_description: >
        王献之是王羲之之子，书法与其父并称"二王"。
        特点：外拓奔放，比其父更加放开；连绵草书更为显著；
        笔势飞扬，个性强烈；结体开张，不拘一格。
        但在含蓄蕴藉方面略逊其父。

    visual_key_differences:
      - dimension: "线条气质"
        a: "含蓄内敛，精到不外露"
        b: "外拓奔放，锋芒外现"
      - dimension: "连绵程度"
        a: "若有若无的呼应，不过度连绵"
        b: "连绵更为大胆显著"
      - dimension: "结体"
        a: "秀美端庄"
        b: "开张奇肆"
      - dimension: "墨色"
        a: "浓淡适中"
        b: "对比更强烈"

    teaching_usage: >
      辨析"二王"草书，重点在"含蓄vs奔放"的风格对比。
      入门以王羲之入手为宜（法度严谨）。

    prompt_template: >
      中国书法对比插图。
      左侧：王羲之草书风格，字形秀美端庄，笔意含蓄内敛，
            连绵若有若无，用笔精到，线条含蓄不外露。
      右侧：王献之草书风格，字形开张奇肆，笔势飞扬奔放，
            连绵大胆显著，线条外拓有锋芒。
      同一字"中"，两幅并排，教育教科书风格。

  # 辨析对 2：张旭 vs 怀素 ─────────────────────
  - pair_id: zhangxu_vs_huaisu
    pair_label: "张旭 vs 怀素"

    calligrapher_a:
      id: zhangxu
      name: 张旭
      period: "唐代（唐，约675-约750年）"
      style_tag: "颠·圆·满纸云烟"
      style_description: >
        张旭，世称"草圣"，与李白诗歌、裴旻剑舞并称"三绝"。
        特点：狂草，线条圆转如龙蛇；转折处以圆为主；
        墨色浓淡对比鲜明；气势磅礴，满纸云烟；
        笔势疾徐振荡，有"颠"之名。
        传其观公孙大娘剑器舞而悟笔法。

    calligrapher_b:
      id: huaisu
      name: 怀素
      period: "唐代（737-799年）"
      style_tag: "醉·瘦·骤雨旋风"
      style_description: >
        怀素，与张旭并称"颠张醉素"。
        特点：狂草，线条瘦硬如钢丝（与张旭显著区别）；
        转折处锐角与圆转并存；
        墨色以枯为主（骤雨旋风形容其速度）；
        字形大小悬殊，变化剧烈；
        笔势更为迅疾，有"醉素"之名。
        代表作《自叙帖》被称"天下第一草书"。

    visual_key_differences:
      - dimension: "线条粗细"
        a: "线条粗细对比强烈（圆转变幻）"
        b: "线条以瘦硬为主，粗细对比相对较小"
      - dimension: "转折"
        a: "圆转为主（如龙蛇）"
        b: "锐角与圆转并存（更硬朗）"
      - dimension: "墨色"
        a: "浓淡对比鲜明（满纸云烟）"
        b: "以枯为主（骤雨旋风）"
      - dimension: "字形"
        a: "字形大小较一致"
        b: "字形大小悬殊，变化剧烈"
      - dimension: "连绵"
        a: "连绵圆转"
        b: "连绵更甚，速度感更强"

    teaching_usage: >
      辨析"颠张醉素"，核心在"圆vs瘦、浓vs枯"的视觉对比。
      张旭入手更宜（圆转流畅），再学怀素（瘦硬迅疾）。

    prompt_template: >
      中国书法对比插图。
      左侧：张旭狂草，线条粗细对比强烈，圆转如龙蛇，
            墨色浓淡对比鲜明，满纸云烟，气势磅礴。
      右侧：怀素狂草，线条瘦硬如钢丝，转折锐角与圆转并存，
            墨色以枯为主，骤雨旋风，速度感强烈。
      同一字，竖排两列，教育教科书风格，标注书家名和作品名。

  # 辨析对 3：孙过庭 vs 赵孟頫（楷行过渡）─────
  - pair_id: sunguoting_vs_zhaomengfu
    pair_label: "孙过庭·书谱 vs 赵孟頫·行楷"

    calligrapher_a:
      id: sun_guoting
      name: 孙过庭
      period: "唐代（约646-约687年）"
      style_tag: "今草·法度谨严·书谱之祖"
      style_description: >
        孙过庭《书谱》是书法理论与实践的双重经典。
        特点：严格遵循草法规范；字形相对独立（不完全连绵）；
        适合作为草书入门范本；笔法精到，学王羲之；
        墨色温润，气韵清雅。

    calligrapher_b:
      id: zhao_mengfu
      name: 赵孟頫
      period: "元代（1254-1322年）"
      style_tag: "复古·遒丽·圆润"
      style_description: >
        赵孟頫提倡"复古"，书法各体皆精。
        特点：楷行相融，以楷形行意；用笔遒丽圆润；
        结体端正秀美；适合入门和日常书写；
        但创新性不足，被批评为"奴书"。

    visual_key_differences:
      - dimension: "符号化程度"
        a: "草书符号规范，可识读性强"
        b: "楷行相融，符号化程度低"
      - dimension: "连绵"
        a: "字形独立，不刻意连绵"
        b: "偶有连绵，但不过度"
      - dimension: "风格"
        a: "古雅清劲"
        b: "秀美圆润"
      - dimension: "难度"
        a: "适合进阶（需草法基础）"
        b: "适合入门（楷行过渡）"

    prompt_template: >
      中国书法对比插图。
      左侧：孙过庭草书，今草风格，法度谨严，字形独立，
            笔法精到，线条古雅清劲，墨色温润。
      右侧：赵孟頫行楷，楷行相融，圆润秀美，结构端正，
            用笔遒丽，线条流畅但不连绵。
      同一字，竖排两列，标注书家名和作品名，教育教科书风格。

# ============================================================
# 模块五：认知层级（Cognitive Levels）
# ============================================================
# 核心用途：适配不同学段/学习阶段的认知需求
# L1=入门/L2=进阶/L3=专业
# ============================================================

cognitive_levels:

  - level: L1_入门
    description: "笔画认知 + 田字格定位"
    visual_requirements:
      - "田字格/米字格参考线清晰可见"
      - "笔画顺序编号（①②③…）"
      - "笔画末端标注方向"
      - "主笔红色高亮"
