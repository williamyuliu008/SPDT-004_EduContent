content_spec:
  version: "1.0"
  episode_id: "ep09"
  episode_title: "南门之木"
  subtitle: "商鞅变法·战国秩序的诞生"
  schema_ref: "T2-GEO-004"

  # ─────────────────────────────────────────
  # M1 六维度 · 内容目标
  # ─────────────────────────────────────────
  content_goal:
    core_message: >
      商鞅变法是中国历史上最彻底的制度变革。
      其核心逻辑是：以法治代替人治，以功绩代替出身，以秩序代替混乱。
      卫鞅以自己的生命为代价，证明了一个悖论：
      真正伟大的制度，不依赖创立者的生命，而依赖制度本身的生命力。
    target_audience: "高中艺考/高考历史/书法校考（高二至高三）"
    audience_level: "high_school_advanced"
    audience_knowledge_prerequisite: >
      初中历史基础（战国七雄、秦始皇统一六国）；
      了解"商鞅变法"这一历史事件名称；
      书法方面：知道小篆是秦朝统一后的标准字体
    learning_outcomes:
      - "能复述商鞅变法的五大主要内容"
      - "能解释'南门立木'的政治智慧"
      - "能分析商鞅变法成功的原因"
      - "能理解小篆'圆/均/对称'特征与法家秩序的内在联系"

  # ─────────────────────────────────────────
  # M1 六维度 · 体裁约束
  # ─────────────────────────────────────────
  genre_constraints:
    genre: "墨骨山河_ep_series"
    genre_type: "B5_visual_narrative"        # SOP v4.0 B5 视觉叙事分类
    recommended_execution_mode: "Mode_C_混合执行"  # 文档=微剧本JSON，本体=历史×书法考点
    structure:
      acts: 3
      scenes_total: 17
      script_format: "T2-GEO-004 JSON"
      scene_types:
        - narrative    # 叙事场景
        - dialogue     # 对话场景
        - concept      # 概念讲解
    length:
      per_scene_chars: "300-600字"
      total_script_chars: "约5000字"
      estimated_duration: "15-20分钟"
    delivery_format:
      script: "JSON（T2-GEO-004 schema）"
      illustrations: "PNG × 6张"
      app_page: "HistoryGalleryPage.ets"
      web_viewer: "HTML gallery"

