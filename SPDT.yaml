# SPDT-004: 自适应备考智能体产品线 (Adaptive Prep Intelligence Platform)
# 版本：v2.4（2026-07-30 更新）

spdt_id: SPDT-004
spdt_name: 自适应备考智能体产品线
spdt_name_en: Adaptive Prep Intelligence Platform
owner_agent: agent-e926h
created: 2026-07-10
version: 3.0
last_updated: 2026-08-21
layer_architecture_version: 1.0
governance_docs:
  layers: LAYERS.md
  windows: WINDOWS.md
  checklist: docs/governance/分层治理检查清单.md

description: |
  「平台 + 课程」双轨交付模式；
  定位：自适应备考平台 = 知识引擎 + 叙事引擎 + 多形态渲染器
  核心主张：「文本体验」是一种新的学习方式——通过剧本杀/知识链/多形态内容让知识活起来
  数据策略：生成物入 D:/4_data/education/，代码入 Git 仓库
  SOP衔接：五阶段流水线 = M0-M6 在教育领域的具体实现（详见 D:/1_omas/governance/内容制造管线执行规范_v1.0.md）
  MODLIB：跨领域共享 Schema/接口协议/模板（详见 D:/1_omas/MODLIB/content_manufacturing/）

# =============================================================================
# 流水线架构（v2.3 核心变更）
# =============================================================================
pipeline:
  name: 知识加工流水线
  stages:
    - id: 1_ingest
      name: 知识摄入
      description: 从原始素材（考纲/古籍/教材）中识别、筛选、校准高质量知识原料
      status: active

    - id: 2_structure
      name: 结构化加工
      description: 将原料转化为 scene_v2 剧本，构建知识图谱，生成多形态内容母版
      components:
        - TextExperience（主力生产引擎）
      status: active
      maturity: 0.8

    - id: 3_render
      name: 渲染生产
      description: 将 scene_v2 转化为音频/视频/知识卡片，执行 CGM 方法论
      components:
        - SPDT-KTE（管线编排）
        - video_factory（PT-VFX 视觉渲染）
      status: active
      maturity: 0.7

    - id: 4_adapt
      name: 自适应编排
      description: 消费渲染产出，构建个性化知识图谱，驱动学习路径编排
      components:
        - AdaptivePrepPlatform
      status: planned
      maturity: 0.1

    - id: 5_deliver
      name: 触达交付
      description: 多端分发（PC 知识图谱 + 手机端知识卡/音频/视频）
      components:
        - TextExperienceAPP（HarmonyOS APP）
      status: active
      maturity: 0.6

# =============================================================================
# 分层架构（v3.0 核心变更，2026-08-21）
# 详见 LAYERS.md + WINDOWS.md
# =============================================================================
layer_architecture:
  version: v1.0
  doc: LAYERS.md
  window_doc: WINDOWS.md
  layers:
    L0_stable:
      description: 已通过端到端验证、契约稳定、不预期大改
      windows: [W_low]
      examples: [1_ingest, knowledge_cards, 转换/推送工具链, 质量审计, templates]
    L1_evolutionary:
      description: 日常小迭代的模块，频繁有新内容/配置加入，但接口和契约稳定
      windows: [W_mid, W_low]
      examples: [CGM SOP, 2_structure 已产物, Skill 系统, autoclaw_kit, 治理文档]
    L2_experimental:
      description: 频繁变、正在搭、未来预期大改的模块
      windows: [W_high]
      examples: [4_adapt, 跨包联动, 古史_v4 扩产, 墨骨山河 ep02-08, ebook_builder Stage A, 新 Skill 探索]
  upgrade_path: "L2 → L1 需 ≥3 次成功 + 接口冻结 + 测试覆盖 ≥70%；L1 → L0 需 willi 拍板 + 持续稳定 ≥3 个月"

