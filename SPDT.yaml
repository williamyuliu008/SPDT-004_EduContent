# =============================================================================
# 数据架构（代码与数据分离）
# =============================================================================
data_architecture:
  root: D:/4_data/education/
  principle: "生成物入数据目录，源代码入 Git 仓库"
  directories:
    2_structure:
      path: D:/4_data/education/TextExperience/
      structure:
        _source: 生成脚本+meta（镜像 products/courses/）
        _intermediate: scene JSONs/帧文件（管线中间产物）
        _output: audio MP3/ebook/cards（最终交付物）
    4_adapt:
      path: D:/4_data/education/AdaptivePrep/
      structure:
        _input: 消费 3_render/_output/
        knowledge_graph: 个性化知识图谱
        user_profiles: 用户学习画像
    5_deliver:
      path: D:/4_data/education/TextExperienceAPP/
      structure:
        _cache: 离线内容包缓存
  lifecycle: |
    _source（版本控制）→ _intermediate（缓存可重建）→ _output（交付）→ _input（消费）

