# SPDT-004: 自适应备考智能体产品线 (Adaptive Prep Intelligence Platform)
# 版本：v2.3（2026-07-29 更新）

spdt_id: SPDT-004
spdt_name: 自适应备考智能体产品线
spdt_name_en: Adaptive Prep Intelligence Platform
owner_agent: agent-e926h
created: 2026-07-10
version: 2.3
last_updated: 2026-07-29

description: |
  「平台 + 课程」双轨交付模式；
  定位：自适应备考平台 = 知识引擎 + 叙事引擎 + 多形态渲染器
  核心主张：「文本体验」是一种新的学习方式——通过剧本杀/知识链/多形态内容让知识活起来
  数据策略：生成物入 D:/4_data/education/，代码入 Git 仓库
  SOP衔接：五阶段流水线 = M0-M6 在教育领域的具体实现（详见 D:/1_omas/governance/内容制造管线执行规范_v1.0.md）

# =============================================================================
# 流水线架构（v2.3 核心变更）
# =============================================================================
pipeline:
  name: 知识加工流水线
  stages:
    - id: 1_ingest
      name: 知识摄入
      description: 从原始素材（考纲/古籍/教材）中识别、筛选、校准高质量知识原料
      status: planned

    - id: 2_structure
      name: 结构化加工
      description: 将原料转化为 scene_v2 剧本，构建知识图谱，生成多形态内容母版
      components:
        - TextExperience（主力生产引擎）
      status: active
      maturity: 0.8

    - id: 3_render
      name: 渲染生产
      description: 将 scene_v2 转化为音频/视频/知识卡片，执行 CGM 方法论
      components:
        - SPDT-KTE（管线编排）
        - video_factory（PT-VFX 视觉渲染）
      status: active
      maturity: 0.7

    - id: 4_adapt
      name: 自适应编排
      description: 消费渲染产出，构建个性化知识图谱，驱动学习路径编排
      components:
        - AdaptivePrepPlatform
      status: planned
      maturity: 0.1

    - id: 5_deliver
      name: 触达交付
      description: 多端分发（PC 知识图谱 + 手机端知识卡/音频/视频）
      components:
        - TextExperienceAPP（HarmonyOS APP）
      status: active
      maturity: 0.6

# =============================================================================
# PDT / 内容包注册表
# =============================================================================
pdt_list:

  # ── 流水线阶段 ────────────────────────────────────────────────────────────

  - pdt_id: TextExperience
    name: TextExperience
    name_zh: 文本体验内容生产
    layer: 2_structure
    role: 主力生产模块——墨骨山河剧本 + 古史知识链的生产流水线
    directory: 2_structure/TextExperience
    git: https://github.com/williamyuliu008/PT-038_TextExperience
    status: active
    registered: 2026-07-14
    maturity: 0.8
    note: "主力生产模块；Git仓库独立管理；内容分发至 products/courses/；⚠️ Ep01-08 剧本缺失"
    content_packages:
      - 书法备考_墨骨山河（Ep01-09剧本）
      - 历史备考_古史知识链（v1-v4，4卷）

  - pdt_id: SPDT-KTE
    name: KTE
    name_zh: 跨产品内容管线
    layer: 3_render
    role: 剧本→场景→视频/音频/卡片的渲染编排（CGM方法论执行）
    directory: 3_render/SPDT-KTE
    status: active
    registered: 2026-07-16
    maturity: 0.7
    members:
      - TextExperience（内容工厂）
      - PT-VFX（视觉渲染引擎）
      - PT-RUJ（移动交付终端）

  - pdt_id: PT-VFX
    name: VideoFactory
    name_zh: 视觉渲染引擎
    layer: 3_render
    role: 视频/图像/音频渲染执行
    directory: 3_render/video_factory
    status: active
    registered: 2026-07-16
    maturity: 0.7

  - pdt_id: AdaptivePrepPlatform
    name: AdaptivePrepPlatform
    name_zh: 自适应备考编排平台
    layer: 4_adapt
    role: |
      5 Agent 调度（Analyst/Architect/Visual/Coach/Conductor）
      知识图谱 + 全局记忆 + 自适应训练编排
    directory: 4_adapt/AdaptivePrepPlatform
    status: active
    registered: 2026-07-13
    maturity: 0.1
    note: "BUILD-R+CGM融合；编排消费 2_structure 和 products/courses/ 内容；数据存储于 D:/4_data/education/AdaptivePrep/"

  - pdt_id: TextExperienceAPP
    name: TextExperienceAPP
    name_zh: 文本体验APP开发平台
    layer: 5_deliver
    role: 新学习方式交付终端——HarmonyOS APP（rujing/gaokao-*/thinkkit-*）
    directory: 5_deliver/TextExperienceAPP
    status: active
    registered: 2026-07-29
    maturity: 0.6
    app_count: 13
    note: rhythm-* 5个移回 SPDT-001_Harmony（2026-07-29修正）

  - pdt_id: PT-039
    name: CalligraphyVision
    name_zh: 书法视觉素材库
    layer: products
    role: 书法碑帖素材提取 + 草书辨析卡 + 视觉本体库
    directory: products/PT-039_CalligraphyVision
    status: active
    registered: 2026-07-21
    maturity: 0.8
    note: 辨析卡v4（13张）存储于 products/courses/书法备考_墨骨山河/草书辨析卡/；为 2_structure 和 5_deliver 提供视觉素材

  # ── 独立产品线（不在 SPDT-004 内）──────────────────────────────

  - pdt_id: PT-030
    name: GaokaoPrep
    name_zh: 高考备考内容工厂
    layer: standalone
    role: AI自学平台（smart_edu Agent集群），与 SPDT-004 流水线不同
    directory: ../PT-030_GaokaoPrep
    status: active
    registered: 2026-07-10
    note: 独立产品线，已移出 SPDT-004_EduContent

  - pdt_id: PT-032
    name: CollegeCourseware
    name_zh: 高等课件工厂
