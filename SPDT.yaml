# SPDT-004: 自适应备考智能体产品线 (Adaptive Prep Intelligence Platform)
# 版本：v2.0（2026-07-29 重构）

spdt_id: SPDT-004
spdt_name: 自适应备考智能体产品线
spdt_name_en: Adaptive Prep Intelligence Platform
owner_agent: agent-e926h
created: 2026-07-10
version: 2.0
last_updated: 2026-07-29

description: |
  「平台 + 课程」双轨交付模式：
  - 平台层（platform/）：自适应备考编排引擎（PT-037）+ APP交付终端（SPDT-014）+ 跨产品渲染管线（SPDT-KTE）
  - 内容层（products/）：按课程系列组织（书法备考/历史备考），每门课程 = 知识链+剧本+卡片+音频+视频
  定位：自适应备考平台 = 知识引擎 + 叙事引擎 + 多形态渲染器

# =============================================================================
# 架构分层
# =============================================================================
architecture:
  layers:
    - name: platform
      zh: 平台层
      description: 编排引擎 + 交付终端 + 渲染管线
      components:
        - PT-037_AdaptivePrepPlatform
        - SPDT-014_EduApps
        - SPDT-KTE

    - name: products
      zh: 内容层
      description: 按课程系列组织的备考内容包
      components:
        - courses/书法备考_墨骨山河
        - courses/历史备考_古史知识链
        - PT-039_CalligraphyVision（书法视觉素材库）

    - name: infrastructure
      zh: 基础设施
      description: 共享工具和资产
      components:
        - shared/video_factory（PT-VFX 视觉渲染）
        - quality（质量门禁）
        - templates（CGM模板）

# =============================================================================
# PDT / 内容包注册表
# =============================================================================
pdt_list:

  # ── 平台层 ────────────────────────────────────────────────────────────────

  - pdt_id: PT-037
    name: AdaptivePrepPlatform
    name_zh: 自适应备考编排平台
    layer: platform
    role: |
      5 Agent 调度（Analyst/Architect/Visual/Coach/Conductor）
      知识图谱 + 全局记忆 + 自适应训练编排
    directory: platform/PT-037_AdaptivePrepPlatform
    status: active
    registered: 2026-07-13
    maturity: 0.1
    note: "BUILD-R+CGM融合；首发国美书法配置包；编排消费 products/courses/ 内容"

  - pdt_id: SPDT-014
    name: EduApps
    name_zh: 教育类APP开发平台
    layer: platform
    role: HarmonyOS APP 交付终端（rujing/gaokao-*/thinkkit-*）
    directory: platform/SPDT-014_EduApps
    status: active
    registered: 2026-07-29
    app_count: 13
    note: rhythm-* 5个移回 SPDT-001_Harmony（2026-07-29修正）

  - pdt_id: SPDT-KTE
    name: KTE
    name_zh: 跨产品内容管线
    layer: platform
    role: 剧本->场景->视频/音频/卡片的渲染编排
    directory: SPDT-KTE
    status: active
    registered: 2026-07-16
    members:
      - PT-038（内容工厂）
      - PT-VFX（视觉渲染引擎）
      - PT-RUJ（移动交付终端）

  # ── 内容层 ────────────────────────────────────────────────────────────────

  - pdt_id: PT-038
    name: TextExperience
    name_zh: 文本体验内容生产
    layer: products
    role: 墨骨山河剧本 + 古史知识链的生产流水线
    directory: PT-038_TextExperience
    git: https://github.com/williamyuliu008/PT-038_TextExperience
    status: active
    registered: 2026-07-14
    maturity: 0.8
    note: "Git仓库独立管理；内容分发至 courses/；⚠️ Ep01-08 剧本缺失"
    content_packages:
      - 书法备考_墨骨山河（Ep01-09剧本）
      - 历史备考_古史知识链（v1-v4，4卷）

  - pdt_id: PT-039
    name: CalligraphyVision
    name_zh: 书法视觉素材库
    layer: products
    role: 书法碑帖素材提取 + 草书辨析卡 + 视觉本体库
    directory: products/PT-039_CalligraphyVision
    status: active
    registered: 2026-07-21
    maturity: 0.8
    note: 辨析卡v4（13张）存储于 products/courses/书法备考_墨骨山河/草书辨析卡/

  # ── 独立产品线（不在 SPDT-004 内）──────────────────────────────

  - pdt_id: PT-030
    name: GaokaoPrep
    name_zh: 高考备考内容工厂
    layer: standalone
    role: AI自学平台（smart_edu Agent集群），与 SPDT-004 流水线不同
    directory: ../PT-030_GaokaoPrep
    status: active
    registered: 2026-07-10
    note: 独立产品线，已移出 SPDT-004_EduContent

  - pdt_id: PT-032
    name: CollegeCourseware
    name_zh: 高等课件工厂
    layer: standalone
    role: VCC数学动画工厂（CGM+Audit），与 SPDT-004 流水线不同
    directory: ../PT-032_CollegeCourseware
    status: active
    registered: 2026-07-10
    note: 独立产品线，已移出 SPDT-004_EduContent

# =============================================================================
# 跨 SPDT 链接
# =============================================================================
cross_spdt_links:
  - from: SPDT-004
    to: SPDT-001（Harmony通用工具）
    data: 共享 HarmonyOS 构建工具链
    status: active

  - from: SPDT-004
    to: autopublish
    data: 课程内容 -> 飞书/微信/网站分发
    status: active

