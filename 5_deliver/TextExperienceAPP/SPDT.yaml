# SPDT-014: 教育类APP开发平台 v1.0
# 自适应备考平台的APP交付终端

spdt:
  id: SPDT-014
  name: 教育类APP开发平台
  name_en: EduApps Development Platform
  status: active
  created: "2026-07-29"
  lead: PL-edu
  last_active: "2026-07-29"
  priority: highest
  parent_pdt: SPDT-004_EduContent
  version: 1.0

strategy:
  vision: |
    构建教育类APP的快速开发与交付平台，支撑"自适应备考平台=知识引擎+叙事引擎+
    多形态渲染器"的终端交付。通过统一的技术栈（HARMONY OS）和模块化架构，
    让内容团队专注内容创作，平台团队专注技术打磨。

  scope:
    - 教育类HARMONY OS APP开发（备考/思维工具/高考志愿）
    - 跨APP内容包加载机制（APP作为平台，内容包作为产品单元）
    - 多形态渲染管线（剧本杀→APP交互、电子书→阅读器、辨析卡→图文对照）
    # 注意：rhythm-* 系列（习惯/冥想/营养/番茄钟）已移回 SPDT-001_Harmony（2026-07-29修正）

  relationship:
    infra_modules:
      - IRC: D:/3_infra/IRC/  # 公共认知内核（从 SPDT-010_IRC 迁移）
    content_providers:
      - PT-037: 自适应备考平台核心（Agent+知识引擎）
      - PT-038: 文本体验引擎（剧本/ebook/audio/cards）
      - PT-039: 书法视觉素材库

architecture:
  tech_stack:
    os: HarmonyOS
    language: ArkTS / TypeScript
    build: DevEco Studio CLI / hvigor
    deployment: hdc file send / hdc install

  module_structure:
    apps/:
      # 教育核心APP
      - rujing/                  墨骨山河·书法备考（剧本杀+辨析卡）
      - gaokao-agent/            高考AI助手
      - gaokao-language/         高考语文专项
      - gaokao-volunteer/        高考志愿
      # 思维工具系列（学习辅助，非教育核心）
      - thinkkit-coach/          思维教练
      - thinkkit-flashcard/      闪卡记忆
      - thinkkit-flashcard2/     闪卡v2
      - thinkkit-mindmap/         思维导图
      - thinkkit-note/            笔记
      - thinkkit-quiz/            问答训练
      - thinkkit-reader/          阅读器
      - thinkkit-rss/            RSS订阅
      - thinkkit-zknote/         知识笔记
      # rhythm-* 系列已移回 SPDT-001_Harmony（2026-07-29修正）
    common/:                    跨APP共享模块
    ci/:                        构建流水线
    scripts/:                   开发脚本
    docs/:                      开发文档/SOP
    knowledge/:                 领域知识库
    templates/:                 项目模板
    automation/:                自动化工具
    signing/:                   签名配置

app_bundle_convention:
  domain_prefix:
    education: "com.harmonystudio.edu"
    thinkkit: "com.harmonystudio.thinkkit"
    rhythm:   "com.harmonystudio.rhythm"

pipeline:
  build: DevEco CLI / hvigor (via DEVECO_SDK_HOME)
  deploy: hdc file send + hdc install
  target_path: /data/local/tmp/{app_name}/
  signing: signing/ 目录下按APP配置

dependencies:
  shared_engine:
    irc: D:/3_infra/IRC/
    path_in_app: $DEVECO_SDK_HOME/../common/irc/

  content_packages:
    pt038_content: D:/2_products/education/SPDT-004_EduContent/products/PT-038_TextExperience/
    pt039_assets:  D:/2_products/education/SPDT-004_EduContent/products/PT-039_CalligraphyVision/

migration_history:
  - date: "2026-07-29"
    from: D:/2_products/platform/SPDT-001_Harmony/apps/（13个教育类APP）
    to: D:/2_products/education/SPDT-004_EduContent/platform/SPDT-014_EduApps/apps/
    reason: 专注教育类APP开发，与通用craftsman/harmonycoder工具分离
    apps: rujing/gaokao-agent/gaokao-language/gaokao-volunteer/thinkkit-*/ (13个)
  - date: "2026-07-29"
    from: D:/2_products/education/SPDT-004_EduContent/platform/SPDT-014_EduApps/apps/（5个rhythm-*APP）
    to: D:/2_products/platform/SPDT-001_Harmony/apps/
    reason: rhythm-*系列与教育无关，移回通用平台
    apps: rhythm-habit/rhythm-habit-game/rhythm-meditation/rhythm-nutrition/rhythm-pomodoro
