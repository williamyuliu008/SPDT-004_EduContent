# 学习模板：函数与导数
# thinkkit-coach 模板引擎 v1.0

template:
  id: "function_derivative"
  title: "导数应用"
  subject: "数学"
  chapter: "函数与导数"
  estimated_minutes: 40
  difficulty: 3

  steps:
    - id: "concept"
      title: "概念直觉"
      minutes: 5
      metaphor: "导数是什么？想象你在开车——速度表上的数字就是位置对时间的导数。\n如果速度表指针一直在增加，说明你在加速（一阶导递增）；如果指针稳定，你在匀速。"
      key_points:
        - "导数 = 瞬时变化率"
        - "切线斜率 = 该点的导数值 f'(a)"
        - "f'(x)>0 → 函数递增；f'(x)<0 → 函数递减"
      quiz:
        question: "一辆车的速度从 0 增加到 100km/h，这个过程中："
        options: ["位置的一阶导数为正", "位置的二阶导数为正", "位置不变", "速度不变"]
        answer: 0

    - id: "formula"
      title: "公式推导"
      minutes: 10
      formula_flow:
        - "定义：f'(x) = lim[h→0] (f(x+h)-f(x))/h"
        - "导出：(xⁿ)' = nxⁿ⁻¹"
        - "导出：(sin x)' = cos x"
        - "导出：(eˣ)' = eˣ"
      lingkong:
        question: "用定义推导 (x²)' = 2x"
        hint: "展开 (x+h)²，约去 h，再取极限"

    - id: "example"
      title: "经典例题"
      minutes: 15
      examples:
        - id: "ex1"
          difficulty: 2
          question: "求函数 f(x)=x³-3x+1 在区间 [-2,2] 上的最大值和最小值"
          examiner_view: "考察对极值点和端点值的综合判断——很多学生只求极值忘记检查端点"
          solution_steps:
            - "f'(x)=3x²-3=3(x+1)(x-1)"
            - "驻点：x=-1, x=1"
            - "f(-2)=-1, f(-1)=3, f(1)=-1, f(2)=3"
            - "最大值=3(x=-1或x=2)；最小值=-1(x=-2或x=1)"
        - id: "ex2"
          difficulty: 4
          question: "讨论函数 f(x)=ax³-bx+1 在 a>0, b>0 时的极值情况"
          examiner_view: "含参讨论的核心是对参数分类——这里 a>0 和 b>0 已经限定了范围，但学生容易忘记讨论 a=0（退化情况）"
          key_trap: "虽然题目给了 a>0，但在变式训练中可以去掉这个条件让学生自己分类"

    - id: "variant"
      title: "变式训练"
      minutes: 10
      variants:
        - type: "同考点变数字"
          question: "f(x)=2x³-6x+5，求 [-1,3] 上的最值"
        - type: "加陷阱"
          question: "f(x)=x³-3x+1，判断 x=1 处取得极大值还是极小值？如果不求导能判断吗？"
        - type: "逆问题"
          question: "已知 f(x)=x³+ax²+bx 在 x=1 处取得极小值-2，求 a,b"

    - id: "checkpoint"
      title: "章节检测"
      minutes: 10
      questions: 5
      pass_threshold: 0.6
