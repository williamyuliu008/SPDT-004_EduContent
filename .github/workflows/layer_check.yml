# SPDT-004 分层治理 CI
# 详见 docs/governance/分层治理检查清单.md
name: Layer Check

on:
  push:
    branches: [main, develop, "feature/*", "fix/*", "experimental/*"]
  pull_request:
    branches: [main, develop]

# 取消重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 文档一致性（必过，error 阻断）
  # ============================================================
  doc-sync:
    name: Layer Doc Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check doc & code consistency
        run: |
          python tools/layer_doc_sync.py

  # ============================================================
  # Job 2: 跨层依赖检查（必过，error 阻断）
  # ============================================================
  layer-lint:
    name: Layer Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check cross-layer dependencies
        run: |
          python tools/layer_lint.py
          # 严格模式：warning 也算失败
          python tools/layer_lint.py --strict

  # ============================================================
  # Job 3: 窗口检查（PR only，warning 不阻断）
  # ============================================================
  window-check:
    name: Window Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check current window
        run: |
          python tools/window_check.py || echo "::warning::Window mismatch detected (informational only)"

  # ============================================================
  # Job 4: L0 关键路径冒烟（仅 L0 改动时触发）
  # ============================================================
  l0-smoke:
    name: L0 Smoke Test
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, '1_ingest') ||
      contains(github.event.head_commit.modified, 'templates') ||
      contains(github.event.head_commit.modified, 'quality')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: L0 marker check
        run: |
          echo "L0 改动检测到，验证 L0 标识完整性..."
          python -c "
          import sys
          sys.path.insert(0, 'tools')
          from layer_lint import detect_layer, LAYER_MAP
          from pathlib import Path
          errors = []
          for f in Path('1_ingest').rglob('*.py'):
              layer = detect_layer(f, Path('.'))
              if layer != 'L0':
                  errors.append(f'{f} -> {layer}')
          if errors:
              print('ERROR: L0 目录文件被错误标记:')
              for e in errors:
                  print(f'  {e}')
              sys.exit(1)
          print('OK: L0 标识正确')
          "

  # ============================================================
  # Job 5: 汇总报告
  # ============================================================
  summary:
    name: Layer Check Summary
    runs-on: ubuntu-latest
    needs: [doc-sync, layer-lint, window-check, l0-smoke]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## SPDT-004 分层治理 CI 报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Doc Sync | ${{ needs.doc-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Layer Lint | ${{ needs.layer-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Window Check | ${{ needs.window-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| L0 Smoke | ${{ needs.l0-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "详见: docs/governance/分层治理检查清单.md" >> $GITHUB_STEP_SUMMARY
