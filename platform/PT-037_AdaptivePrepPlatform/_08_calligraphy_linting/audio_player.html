<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书法临帖 · 墨骨山河音频版</title>
  <style>
    /* ─────────────────────────────────────────
       字体 & 变量
    ───────────────────────────────────────── */
    :root {
      --ink: #1a1208;
      --paper: #f5f0e8;
      --paper-dark: #e8dfd0;
      --accent: #8b1a1a;
      --accent-light: #c0392b;
      --gold: #c9a84c;
      --gold-light: #e8c870;
      --muted: #7a6a52;
      --shadow: rgba(26,18,8,0.12);
      --border: #d4c9b0;
      --player-bg: #2d2010;
      --player-text: #f0e8d0;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', 'Noto Serif SC', 'Source Han Serif CN', '宋体', serif;
      background: var(--ink);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 宣纸纹理背景 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(201,168,76,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(139,26,26,0.06) 0%, transparent 50%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(139,26,26,0.015) 3px,
          rgba(139,26,26,0.015) 4px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ─────────────────────────────────────────
       顶部导航
    ───────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--ink);
      border-bottom: 1px solid rgba(201,168,76,0.3);
      padding: 12px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .logo {
      font-size: 18px; font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
    }
    .logo span { color: var(--accent-light); }
    .header-nav {
      margin-left: auto;
      display: flex; gap: 8px;
    }
    .nav-btn {
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--gold);
      padding: 6px 14px; border-radius: 20px;
      font-size: 13px; cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .nav-btn:hover, .nav-btn.active {
      background: rgba(201,168,76,0.2);
      border-color: var(--gold);
    }

    /* ─────────────────────────────────────────
       主布局
    ───────────────────────────────────────── */
    .main {
      position: relative; z-index: 1;
      max-width: 1400px; margin: 0 auto;
      padding: 24px 16px;
    }

    /* 集数选择器 */
    .ep-selector {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .ep-card {
      background: var(--paper);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 160px;
      flex: 1;
    }
    .ep-card:hover { border-color: var(--gold); box-shadow: 0 4px 16px var(--shadow); }
    .ep-card.active {
      border-color: var(--accent);
      background: linear-gradient(135deg, var(--paper) 60%, #f8f0e4);
      box-shadow: 0 4px 20px rgba(139,26,26,0.15);
    }
    .ep-card-num {
      font-size: 11px; color: var(--muted); letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .ep-card-title { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.3; }
    .ep-card-theme { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* 三栏布局 */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: auto 1fr;
      gap: 20px;
      min-height: calc(100vh - 160px);
    }

    /* ─────────────────────────────────────────
       左侧：碑帖展示
    ───────────────────────────────────────── */
    .calligraphy-panel {
      grid-row: 1 / 3;
      display: flex; flex-direction: column; gap: 16px;
    }
    .calligraphy-image {
      background: var(--paper-dark);
      border: 3px solid var(--border);
      border-radius: var(--radius);
      aspect-ratio: 3/4;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      padding: 16px;
    }
    .calligraphy-image::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        45deg,
        rgba(139,26,26,0.02) 0px,
        rgba(139,26,26,0.02) 2px,
        transparent 2px,
        transparent 8px
      );
    }
    .calligraphy-img-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }
    .calligraphy-img-placeholder svg {
      width: 64px; height: 64px;
      opacity: 0.3; margin-bottom: 12px;
    }
    .calligraphy-img-label {
      font-size: 13px; color: var(--muted);
      text-align: center;
    }
    .calligraphy-img-sublabel {
      font-size: 11px; color: #b0a080;
      margin-top: 4px;
    }
    .calligraphy-title {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .calligraphy-title h3 {
      font-size: 15px; font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .calligraphy-title p {
      font-size: 12px; color: var(--muted);
      line-height: 1.6;
    }
    .practice-box {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .practice-box h4 {
      font-size: 13px; font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .practice-box h4::before {
      content: '◆'; color: var(--accent);
      font-size: 10px;
    }
    .practice-item {
      font-size: 12px; color: var(--muted);
      padding: 5px 0;
      border-bottom: 1px dashed var(--border);
      line-height: 1.5;
    }
    .practice-item:last-child { border-bottom: none; }

    /* 五体风格小卡片 */
    .styles-panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .styles-panel h4 {
      font-size: 13px; font-weight: 700;
      color: var(--ink); margin-bottom: 10px;
    }
    .style-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--paper-dark);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px 10px;
      font-size: 11px; color: var(--muted);
      margin: 2px;
      cursor: default;
      transition: all 0.2s;
    }
    .style-tag:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .style-tag.era-tag { color: var(--gold); border-color: rgba(201,168,76,0.4); }

    /* ─────────────────────────────────────────
       中间：播放器 + 字幕
    ───────────────────────────────────────── */
    .center-panel {
      grid-row: 1 / 3;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* 播放器主体 */
    .player-card {
      background: var(--player-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .player-episode-title {
      font-size: 13px; color: var(--gold);
      letter-spacing: 1px; margin-bottom: 14px;
    }
    .player-episode-title strong {
      font-size: 16px; color: var(--player-text);
      display: block; margin-top: 2px;
    }

    /* 波形装饰 */
    .waveform {
      height: 48px; margin-bottom: 14px;
      display: flex; align-items: center; gap: 2px;
    }
    .wave-bar {
      flex: 1;
      background: linear-gradient(to top, var(--gold) 0%, var(--accent-light) 100%);
      border-radius: 2px;
      min-width: 3px; max-width: 8px;
      transition: height 0.3s;
      opacity: 0.5;
    }
    .wave-bar.active {
      opacity: 1;
      animation: wave-pulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes wave-pulse {
      from { transform: scaleY(0.5); }
      to { transform: scaleY(1); }
    }

    /* 进度条 */
    .progress-wrap {
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
      border-radius: 3px;
      position: relative;
      transition: width 0.1s;
    }
    .progress-fill::after {
      content: '';
      position: absolute; right: -6px; top: -5px;
      width: 16px; height: 16px;
      background: var(--gold-light);
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(201,168,76,0.5);
    }
    .time-display {
      display: flex; justify-content: space-between;
      font-size: 11px; color: rgba(240,232,208,0.5);
      margin-top: 6px;
      font-family: 'Courier New', monospace;
    }

    /* 控制按钮 */
    .controls {
      display: flex; align-items: center;
      justify-content: center; gap: 16px;
      margin-bottom: 14px;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--player-text);
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      font-size: 16px;
    }
    .ctrl-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(201,168,76,0.4);
      color: var(--gold);
    }
    .ctrl-btn.play-btn {
      width: 60px; height: 60px;
      background: var(--accent);
      border-color: var(--accent-light);
      font-size: 22px;
    }
    .ctrl-btn.play-btn:hover {
      background: var(--accent-light);
      color: #fff;
    }
    .speed-btn {
      width: 44px; height: 44px;
      border-radius: 22px;
      font-size: 12px; font-weight: 700;
      font-family: inherit;
    }

    /* 倍速选择器 */
    .speed-options {
      display: flex; justify-content: center;
      gap: 6px; margin-bottom: 14px;
    }
    .speed-opt {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(240,232,208,0.5);
      padding: 4px 12px; border-radius: 12px;
      font-size: 12px; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .speed-opt.active {
      background: rgba(201,168,76,0.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* 字幕区 */
    .script-panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex: 1;
      overflow: hidden;
    }
    .script-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .script-header h4 {
      font-size: 13px; color: var(--ink);
    }
    .script-mode-toggle {
      display: flex; gap: 4px;
    }
    .script-mode-btn {
      background: var(--paper-dark);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 3px 10px; border-radius: 12px;
      font-size: 11px; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .script-mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .script-scroll {
      height: 320px; overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }
    .script-scroll::-webkit-scrollbar { width: 4px; }
    .script-scroll::-webkit-scrollbar-track { background: var(--paper-dark); }
    .script-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .script-line {
      font-size: 14px; line-height: 2; color: var(--muted);
      padding: 6px 10px; border-radius: 6px;
      cursor: pointer; transition: all 0.2s;
      margin-bottom: 4px;
      border-left: 3px solid transparent;
    }
    .script-line:hover {
      background: var(--paper-dark);
      color: var(--ink);
    }
    .script-line.active {
      background: linear-gradient(90deg, rgba(139,26,26,0.08) 0%, transparent 100%);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .script-line .scene-tag {
      font-size: 11px; color: var(--gold);
      background: rgba(201,168,76,0.1);
      padding: 1px 6px; border-radius: 8px;
      margin-right: 8px; font-family: monospace;
    }
    .script-time {
      font-size: 10px; color: #c0b090;
      margin-right: 8px;
      font-family: 'Courier New', monospace;
      vertical-align: middle;
    }

    /* ─────────────────────────────────────────
       右侧：计时器 + 讲稿全文
    ───────────────────────────────────────── */
    .right-panel {
      grid-row: 1 / 3;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* 计时器 */
    .timer-card {
      background: var(--paper);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .timer-card h4 {
      font-size: 13px; font-weight: 700;
      color: var(--ink); margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .timer-display {
      text-align: center; margin-bottom: 14px;
    }
    .timer-clock {
      font-family: 'Courier New', monospace;
      font-size: 48px; font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      line-height: 1;
    }
    .timer-label {
      font-size: 11px; color: var(--muted);
      margin-top: 6px; letter-spacing: 1px;
    }
    .timer-presets {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 12px;
    }
    .timer-preset {
      background: var(--paper-dark);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px; border-radius: var(--radius);
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      text-align: center; font-family: inherit;
    }
    .timer-preset:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .timer-preset.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .timer-custom {
      display: flex; gap: 6px; margin-bottom: 12px;
    }
    .timer-custom input {
      flex: 1;
      background: var(--paper-dark);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 10px;
      font-size: 13px; color: var(--ink);
      font-family: inherit;
      outline: none;
    }
    .timer-custom input:focus {
      border-color: var(--gold);
    }
    .timer-custom span {
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center;
    }
    .timer-actions {
      display: flex; gap: 8px;
    }
    .timer-btn {
      flex: 1;
      padding: 10px; border-radius: var(--radius);
      font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      border: none; font-family: inherit;
    }
    .timer-btn.start {
      background: var(--accent);
      color: #fff;
    }
    .timer-btn.start:hover { background: var(--accent-light); }
    .timer-btn.pause {
      background: var(--gold);
      color: var(--ink);
    }
    .timer-btn.pause:hover { background: var(--gold-light); }
    .timer-btn.reset {
      background: var(--paper-dark);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .timer-btn.reset:hover { border-color: var(--muted); color: var(--ink); }
    .timer-finish-msg {
      display: none;
      text-align: center; margin-top: 12px;
      background: rgba(139,26,26,0.08);
      border: 1px solid rgba(139,26,26,0.2);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px; color: var(--accent);
    }
    .timer-finish-msg.show { display: block; }

    /* 讲稿全文 */
    .full-script-panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex: 1;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .full-script-panel h4 {
      font-size: 13px; font-weight: 700;
      color: var(--ink); padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .full-script-content {
      padding: 14px 16px;
      font-size: 13px; line-height: 2;
      color: var(--muted);
      overflow-y: auto;
      flex: 1;
    }
    .full-script-content p { margin-bottom: 12px; }

    /* 相关碑帖 */
    .related-panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .related-panel h4 {
      font-size: 13px; font-weight: 700;
      color: var(--ink); margin-bottom: 10px;
    }
    .related-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
    }
    .related-item:last-child { border-bottom: none; }
    .related-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .related-info { flex: 1; }
    .related-name { font-size: 13px; font-weight: 600; color: var(--ink); }
    .related-meta { font-size: 11px; color: var(--muted); }

    /* ─────────────────────────────────────────
       提醒弹窗
    ───────────────────────────────────────── */
    .timer-alert-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center; justify-content: center;
    }
    .timer-alert-overlay.show { display: flex; }
    .timer-alert-box {
      background: var(--paper);
      border: 3px solid var(--accent);
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      max-width: 360px;
    }
    .timer-alert-icon {
      font-size: 48px; margin-bottom: 12px;
    }
    .timer-alert-title {
      font-size: 22px; font-weight: 700;
      color: var(--accent); margin-bottom: 8px;
    }
    .timer-alert-text {
      font-size: 14px; color: var(--muted);
      margin-bottom: 20px;
    }
    .timer-alert-btn {
      background: var(--accent);
      color: #fff; border: none;
      padding: 12px 32px; border-radius: 24px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .timer-alert-btn:hover { background: var(--accent-light); }

    /* ─────────────────────────────────────────
       响应式
    ───────────────────────────────────────── */
    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 280px 1fr 280px;
      }
    }
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
      }
      .calligraphy-panel { grid-row: auto; }
      .center-panel { grid-column: 1 / -1; grid-row: auto; }
      .right-panel { grid-column: 1 / -1; grid-row: auto; }
      .script-scroll { height: 240px; }
      .calligraphy-image { aspect-ratio: 4/3; }
    }
    @media (max-width: 600px) {
      .layout {
        grid-template-columns: 1fr;
      }
      header { padding: 10px 14px; }
      .logo { font-size: 15px; }
      .header-nav { display: none; }
      .ep-selector { gap: 8px; }
      .ep-card { min-width: 140px; }
      .calligraphy-image { aspect-ratio: 3/2; }
      .timer-clock { font-size: 36px; }
      .timer-presets { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ── 顶部导航 ── -->
<header>
  <div class="logo">墨<span>骨</span>山河 · 临帖音频版</div>
  <div class="header-nav">
    <button class="nav-btn active" onclick="switchView('player')" id="nav-player">播放器</button>
    <button class="nav-btn" onclick="switchView('styles')" id="nav-styles">五体概览</button>
  </div>
</header>

<!-- ── 主内容 ── -->
<div class="main">

  <!-- 集数选择器 -->
  <div class="ep-selector" id="ep-selector"></div>

  <!-- 三栏布局 -->
  <div class="layout" id="layout-main">

    <!-- 左栏：碑帖展示 -->
    <div class="calligraphy-panel">
      <div class="calligraphy-image" id="calligraphy-image">
        <div class="calligraphy-img-placeholder">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="4" width="48" height="56" rx="2" stroke="currentColor" stroke-width="2"/>
            <line x1="16" y1="16" x2="48" y2="16" stroke="currentColor" stroke-width="1.5"/>
            <line x1="16" y1="24" x2="48" y2="24" stroke="currentColor" stroke-width="1.5"/>

/* ── 集数选择器 ── */
function renderEpSelector() {
  const container = document.getElementById('ep-selector');
  container.innerHTML = EPISODES.map((ep, i) => `
    <div class="ep-card${i === 0 ? ' active' : ''}" onclick="selectEpisode(${i})" id="ep-card-${i}">
      <div class="ep-card-num">EP 0${i+1}</div>
      <div class="ep-card-title">${ep.title}</div>
      <div class="ep-card-theme">${ep.theme}</div>
    </div>
  `).join('');
}

/* ── 选中集数 ── */
function selectEpisode(index) {
  currentEp = index;
  const ep = EPISODES[index];

  // 更新选择器高亮
  document.querySelectorAll('.ep-card').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  // 更新标题区
  document.getElementById('ep-badge').textContent = 'EP 0' + (index+1);
  document.getElementById('ep-full-title').textContent = ep.title;
  document.getElementById('ct-title').textContent = ep.title;
  document.getElementById('ct-subtitle').textContent = ep.theme + ' · ' + ep.subtitle;

  // 更新碑帖图片区
  document.getElementById('img-label').textContent = ep.img_label;
  document.getElementById('img-sublabel').textContent = ep.img_sublabel;

  // 更新临帖要点
  document.getElementById('practice-list').innerHTML = ep.practice_points.map(p =>
    `<div class="practice-item">${p}</div>`
  ).join('');

  // 更新相关碑帖
  document.getElementById('related-list').innerHTML = ep.related_calligraphy.map(r => `
    <div class="related-item">
      <div class="related-dot"></div>
      <div class="related-info">
        <div class="related-name">${r.name}</div>
        <div class="related-meta">${r.era} · ${r.location}</div>
      </div>
    </div>
  `).join('');

  // 更新字幕
  renderScriptLines(ep);

  // 更新讲稿全文
  document.getElementById('full-script').innerHTML = '<p>' +
    ep.timestamps.map(t => t.text).join('</p><p>') + '</p>';

  // 重置音频
  const audio = document.getElementById('audio-player');
  audio.pause();
  audio.currentTime = 0;
  audio.src = '';
  isPlaying = false;
  updatePlayButton();
  updateProgress(0, 0);
  currentScriptIndex = -1;

  // 保存当前集数
  localStorage.setItem('cafa_current_ep', index);
}

/* ── 渲染字幕行 ── */
function renderScriptLines(ep) {
  const container = document.getElementById('script-lines');
  container.innerHTML = ep.timestamps.map((t, i) => {
    const mins = Math.floor(t.time / 60);
    const secs = String(t.time % 60).padStart(2, '0');
    return `<div class="script-line" id="script-line-${i}" onclick="seekTo(${t.time})">
      <span class="script-time">${mins}:${secs}</span>
      <span class="scene-tag">${t.scene}</span>
      ${t.text}
    </div>`;
  }).join('');
}

/* ── 构建波形 ── */
function buildWaveform() {
  const container = document.getElementById('waveform');
  const bars = 60;
  container.innerHTML = '';
  for (let i = 0; i < bars; i++) {
    const bar = document.createElement('div');
    bar.className = 'wave-bar';
    const h = 8 + Math.random() * 36;
    bar.style.height = h + 'px';
    bar.id = 'wave-' + i;
    container.appendChild(bar);
  }
}

/* ── 绑定音频事件 ── */
function bindAudioEvents() {
  const audio = document.getElementById('audio-player');

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    updateProgress(audio.currentTime, audio.duration);
    highlightScript(audio.currentTime);
    animateWave(audio.currentTime / audio.duration);
  });

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-total').textContent = fmtTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    isPlaying = false;
    updatePlayButton();
  });

  audio.addEventListener('error', (e) => {
    // 音频文件不存在时静默处理，原型继续可用
    console.warn('音频加载失败（原型阶段正常）:', audio.src);
  });

  // 进度条点击跳转
  const progressBar = document.getElementById('progress-bar');
  progressBar.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });
}

/* ── 播放控制 ── */
function togglePlay() {
  const audio = document.getElementById('audio-player');
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
  } else {
    // 尝试加载音频（本地路径可能无效，原型阶段静默失败）
    if (!audio.src || audio.src === window.location.href) {
      audio.src = EPISODES[currentEp].audio_path;
    }
    audio.playbackRate = currentSpeed;
    audio.play().catch(() => {});
    isPlaying = true;
  }
  updatePlayButton();
}

function updatePlayButton() {
  const btn = document.getElementById('play-btn');
  if (isPlaying) {
    btn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <rect x="6" y="4" width="4" height="16"/>
      <rect x="14" y="4" width="4" height="16"/>
    </svg>`;
  } else {
    btn.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="5,3 19,12 5,21"/>
    </svg>`;
  }
}

function skip(seconds) {
  const audio = document.getElementById('audio-player');
  if (!audio.src) {
    audio.src = EPISODES[currentEp].audio_path;
  }
  audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + seconds));
}

/* ── 倍速 ── */
function setSpeed(speed) {
  currentSpeed = speed;
  const audio = document.getElementById('audio-player');
  audio.playbackRate = speed;
  document.getElementById('speed-display').textContent = speed + 'x';
  document.querySelectorAll('.speed-opt').forEach(el => {
    el.classList.toggle('active', parseFloat(el.dataset.speed) === speed);
  });
}

function cycleSpeed() {
  const speeds = [0.75, 1, 1.25, 1.5];
  const idx = speeds.indexOf(currentSpeed);
  setSpeed(speeds[(idx + 1) % speeds.length]);
}

/* ── 进度更新 ── */
function updateProgress(current, total) {
  const pct = total > 0 ? (current / total) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('time-current').textContent = fmtTime(current);
  document.getElementById('time-total').textContent = fmtTime(total);
}

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

/* ── 字幕同步 ── */
function highlightScript(currentTime) {
  const ep = EPISODES[currentEp];
  const timestamps = ep.timestamps;

  // 找到当前时间对应的字幕索引
  let activeIndex = -1;
  for (let i = timestamps.length - 1; i >= 0; i--) {
    if (currentTime >= timestamps[i].time) {
      activeIndex = i;
      break;
    }
  }

  if (activeIndex !== currentScriptIndex) {
    currentScriptIndex = activeIndex;

    // 取消之前的激活
    document.querySelectorAll('.script-line').forEach(el => el.classList.remove('active'));

    // 激活当前
    if (activeIndex >= 0) {
      const el = document.getElementById('script-line-' + activeIndex);
      if (el) {
        el.classList.add('active');
        // 自动滚动到可见区域
        const scroll = document.getElementById('script-scroll');
        const elTop = el.offsetTop;
        const elH = el.offsetHeight;
        const scrollH = scroll.clientHeight;
        if (elTop < scroll.scrollTop + 40 || elTop + elH > scroll.scrollTop + scrollH - 40) {
          scroll.scrollTo({ top: elTop - scrollH / 2 + elH / 2, behavior: 'smooth' });
        }
      }
    }
  }
}

function seekTo(seconds) {
  const audio = document.getElementById('audio-player');
  if (!audio.src || audio.src === window.location.href) {
    audio.src = EPISODES[currentEp].audio_path;
  }
  audio.currentTime = seconds;
  audio.playbackRate = currentSpeed;
  if (!isPlaying) {
    audio.play().catch(() => {});
    isPlaying = true;
    updatePlayButton();
  }
}

/* ── 字幕模式切换 ── */
function setScriptMode(mode) {
  scriptMode = mode;
  document.getElementById('mode-sync').classList.toggle('active', mode === 'sync');
  document.getElementById('mode-full').classList.toggle('active', mode === 'full');

  const linesEl = document.getElementById('script-lines');
  if (mode === 'full') {
    linesEl.style.overflow = 'auto';
    linesEl.style.maxHeight = 'none';
  } else {
    linesEl.style.overflow = 'hidden';
    linesEl.style.maxHeight = 'none';
  }
}

/* ── 波形动画 ── */
function animateWave(progress) {
  if (!isPlaying) {
    document.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('active'));
    return;
  }
  const bars = document.querySelectorAll('.wave-bar');
  bars.forEach((bar, i) => {
    const dist = Math.abs((i / bars.length) - progress);
    if (dist < 0.06) {
      bar.classList.add('active');
    } else {
      bar.classList.remove('active');
    }
  });
}

/* ═══════════════════════════════════════════
   计时器
   ═══════════════════════════════════════════ */
function setTimerPreset(minutes) {
  timerTarget = minutes * 60;
  timerSeconds = timerTarget;
  timerRunning = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  document.querySelectorAll('.timer-preset').forEach((el, i) => {
    el.classList.toggle('active', [5,10,15,30][i] === minutes);
  });
  updateTimerDisplay();
  document.getElementById('timer-finish-msg').classList.remove('show');
  showTimerBtns('start');
}

function startCustomTimer() {
  const val = parseInt(document.getElementById('custom-minutes').value);
  if (val > 0 && val <= 120) {
    setTimerPreset(val);
  }
}

function startTimer() {
  if (timerSeconds <= 0) timerSeconds = timerTarget;
  timerRunning = true;
  showTimerBtns('pause');
  timerInterval = setInterval(() => {
    if (!timerRunning) return;
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      timerComplete();
    }
  }, 1000);
}

function pauseTimer() {
  timerRunning = false;
  showTimerBtns('start');
}

function resetTimer() {
  timerRunning = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerSeconds = timerTarget;
  updateTimerDisplay();
  document.getElementById('timer-finish-msg').classList.remove('show');
  showTimerBtns('start');
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  document.getElementById('timer-clock').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function showTimerBtns(state) {
  document.getElementById('timer-start-btn').style.display = state === 'start' ? '' : 'none';
  document.getElementById('timer-pause-btn').style.display = state === 'pause' ? '' : 'none';
}

function timerComplete() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById('timer-finish-msg').classList.add('show');
  showTimerBtns('start');

  // 震动
  if ('vibrate' in navigator) navigator.vibrate([400, 100, 400]);

  // 显示弹窗
  document.getElementById('timer-alert-overlay').classList.add('show');
}

function dismissAlert() {
  document.getElementById('timer-alert-overlay').classList.remove('show');
  if ('vibrate' in navigator) navigator.vibrate(0);
}

/* ═══════════════════════════════════════════
   键盘快捷键
   ═══════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch(e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowLeft':
      skip(-15);
      break;
    case 'ArrowRight':
      skip(15);
      break;
    case 'ArrowUp':
      setSpeed(Math.min(2, currentSpeed + 0.25));
      break;
    case 'ArrowDown':
      setSpeed(Math.max(0.5, currentSpeed - 0.25));
      break;
  }
});

/* ── 视图切换（导航按钮）── */
function switchView(view) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + view)?.classList.add('active');
  // 当前原型仅支持 player 视图，其他视图预留
}

/* ── 启动 ── */
init();
</script>
